<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Firefox Bridge</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 13px/1.45 system-ui, sans-serif; margin: 0; padding: 12px; min-width: 260px; }
    h1 { font-size: 13px; margin: 0 0 8px; letter-spacing: .02em; text-transform: uppercase; opacity: .7; }
    .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; background: #999; }
    .on .dot { background: #2ecc71; }
    .off .dot { background: #e74c3c; }
    .row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .muted { opacity: .65; word-break: break-all; }
    button { font: inherit; padding: 4px 8px; border-radius: 6px; border: 1px solid rgba(128,128,128,.5); background: transparent; color: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Firefox Bridge</h1>
  <div class="row" id="state"><span class="dot"></span><span id="label">checking…</span></div>
  <div class="muted" id="detail"></div>
  <div class="row" style="margin-top:10px">
    <button id="chat">Chat box</button>
    <button id="reconnect">Reconnect</button>
    <button id="options">Options</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
